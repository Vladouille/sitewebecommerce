<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Lanterne d'Ilia</title>
  <meta name="description" content="Fais pivoter les cristaux pour guider la lumière d'Ilia jusqu'aux graines endormies et réveiller le Grand Chêne. 14 énigmes, une histoire.">
  <meta name="theme-color" content="#120c10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23120c10%22/%3E%3Crect x=%2210%22 y=%228%22 width=%2212%22 height=%2216%22 rx=%222%22 fill=%22%23f2a63b%22/%3E%3Crect x=%228%22 y=%226%22 width=%2216%22 height=%223%22 fill=%22%238a5a2b%22/%3E%3Crect x=%228%22 y=%2224%22 width=%2216%22 height=%223%22 fill=%22%238a5a2b%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="jeu.css">
</head>
<body>
  <main class="stage">
    <canvas id="scene" aria-label="Plateau de jeu : grotte, cristaux et graines"></canvas>

    <!-- Barre du niveau -->
    <header class="topbar" id="topbar" hidden>
      <button class="chip" id="btn-map" type="button">Village</button>
      <div class="lvl-title"><small id="lvl-chapter"></small><span id="lvl-name"></span></div>
      <div class="moves"><strong id="moves">0</strong><small>gestes</small></div>
    </header>
    <footer class="bottombar" id="bottombar" hidden>
      <p class="tip" id="tip"></p>
      <div class="actions">
        <button class="chip" id="btn-hint" type="button">Indice</button>
        <button class="chip" id="btn-restart" type="button">Recommencer</button>
      </div>
    </footer>

    <!-- Village : choix des énigmes -->
    <section class="sheet" id="menu" hidden>
      <h1>La Lanterne d'Ilia</h1>
      <p class="oda" id="oda"></p>
      <p class="progress" id="progress"></p>
      <button class="btn-main" id="btn-play" type="button">Continuer</button>
      <div id="chapters"></div>
      <details class="book">
        <summary>Carnet d'Ilia</summary>
        <div id="journal"></div>
      </details>
      <button class="btn-link" id="btn-reset" type="button">Recommencer l'histoire</button>
    </section>

    <!-- Pages de l'histoire -->
    <div class="overlay" id="story" hidden role="dialog" aria-modal="true" aria-labelledby="story-title">
      <div class="card">
        <p class="kicker" id="story-kicker"></p>
        <h2 id="story-title"></h2>
        <p class="story-text" id="story-text"></p>
        <button class="btn-main" id="story-next" type="button">Continuer</button>
      </div>
    </div>

    <!-- Énigme résolue -->
    <div class="overlay" id="win" hidden role="dialog" aria-modal="true" aria-labelledby="win-title">
      <div class="card">
        <p class="kicker" id="win-kicker"></p>
        <h2 id="win-title"></h2>
        <p class="win-stats" id="win-stats"></p>
        <div class="card-actions">
          <button class="btn-main" id="win-next" type="button">Énigme suivante</button>
          <button class="btn-link" id="win-replay" type="button">Rejouer cette énigme</button>
        </div>
      </div>
    </div>
  </main>
  <script src="jeu.js"></script>
</body>
</html>
