# Copie ce fichier en config.yaml puis adapte les recherches.

domain: www.vinted.fr
poll_seconds: 60              # une vérification complète par minute
market_refresh_minutes: 60    # mise à jour de l'échantillon de prix du marché
database: data/vinted.db

# Règles par défaut (chaque recherche peut les surcharger)
rules:
  deal_discount: 0.40         # alerte « bonne affaire » à 40 % sous la médiane
  error_discount: 0.70        # alerte « erreur de prix » à 70 % sous la médiane
  min_samples: 15             # pas d'alerte tant que le marché n'est pas assez connu
  max_age_days: 30
  min_price: 1
  exclude_keywords: [boîte vide, boite vide, faux, replica, réplique, copie, recherche,
                     échange, cassé, hs, pour pièces, sticker, housse]

searches:
  # Le plus simple : fais ta recherche sur vinted.fr (filtres marque, taille, état...),
  # puis colle l'URL de la page de résultats ici.
  - name: Nike Dunk Low
    url: "https://www.vinted.fr/catalog?search_text=nike%20dunk%20low&status_ids[]=6&status_ids[]=1"
    rules:
      max_price: 150

  - name: AirPods Pro
    params:
      search_text: airpods pro 2
    rules:
      deal_discount: 0.35
      exclude_keywords: [boîte vide, boite vide, faux, copie, écouteur gauche, écouteur droit,
                         boîtier seul, boitier seul, hs]
