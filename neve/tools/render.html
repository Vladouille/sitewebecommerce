<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Rendu NÉVÉ</title>
<script type="importmap">{"imports":{"three":"/assets/vendor/three/three.module.min.js"}}</script>
<style>html,body{margin:0;background:transparent}</style></head>
<body><div id="c"></div>
<script type="module">
import { createScene } from '/js/scene3d.js';
const q = new URLSearchParams(location.search);
const el = document.getElementById('c');
if (q.get('bg')) document.body.style.background = q.get('bg');
el.style.width = (q.get('w') || 800) + 'px'; el.style.height = (q.get('h') || 800) + 'px';
try {
  const api = await createScene(el, { interactive: false, preserveDrawingBuffer: true, dpr: 1,
    halves: q.get('halves') || 'both', theta: +(q.get('theta') ?? 16), ball: q.get('ball') === '1',
    yaw: q.has('yaw') ? +q.get('yaw') : -0.5, zoom: +(q.get('zoom') || 1), offsetY: +(q.get('oy') || 0) });
  api.render();
  window.shot = (type, qual) => { api.render(); return api.canvas.toDataURL(type, qual); };
  window.ready = true;
} catch (e) { window.err = String(e && e.stack || e); }
</script></body></html>
